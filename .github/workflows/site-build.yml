name: CareerHub Site Build

on:
  pull_request:
    paths:
      - 'site/**'
      - 'personalisation/**'
      - 'careerhub.yaml'
      - 'profile/**'
      - 'config/**'
      - '.github/workflows/site-build.yml'
      - '.github/workflows/careerhub-operations.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'personalisation/**'
      - 'careerhub.yaml'
      - 'profile/**'
      - 'config/**'
      - '.github/workflows/site-build.yml'
      - '.github/workflows/careerhub-operations.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout canonical CareerHub motor
        uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - name: Verify managed shell is synchronized
        run: |
          python .careerhub-zero/scripts/sync_web_shell.py .
          test -f .github/workflows/careerhub-operations.yml
          test -f site/app/api/action/route.ts
          test -f site/app/api/search/route.ts
          test -f site/app/api/artifact/route.ts
          test -f site/app/find/SearchProfileEditor.tsx
          grep -q "fetch('/api/search'" site/app/find/SearchRunner.tsx
          grep -q "operation: 'analyse_role'" site/app/analyse/AnalyseClient.tsx
          grep -q "fetch('/api/library'" site/app/library/LibraryClient.tsx
          grep -q "dispatch('track_status'" site/app/track/TrackClient.tsx
          rm -rf .careerhub-zero
          git diff --exit-code -- site .github/workflows/careerhub-operations.yml
      - name: Verify protected personalisation was untouched
        run: git diff --exit-code -- personalisation site/personal
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package.json
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build committed site
        working-directory: site
        run: npm run build