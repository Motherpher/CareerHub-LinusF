version: "2.1"
intent: "Discover opportunities broadly enough to learn what the market responds to while keeping candidate evidence separate from search hypotheses."

geographies:
  country: "SE"
  anchors:
    - Stockholm
    - Uppsala
  remote_allowed: true
  remote_scopes:
    - SE
  progressive_widening:
    - anchor
    - travel_time
    - functional_labour_market
    - region
    - country
    - remote

engagement_types:
  - permanent employment
  - fixed-term employment
  - consulting assignment
  - fractional/embedded advisory where relevant

salary:
  employment_market_test: "Do not auto-reject by salary unless explicitly stated in the vacancy. Capture salary where available and analyse separately."
  consulting_general_rate_sek_per_hour_ex_vat: 1200
  consulting_strategic_reduced_rate_sek_per_hour_ex_vat: 1000
  consulting_full_time_month_floor_sek: 50000

lanes:
  - lane_id: L1
    name: "Strategic process / organisational development"
    bucket: core
    priority: 1
    queries: [verksamhetsutvecklare, organisationsutvecklare, processledare, processutvecklare, strategisk verksamhetsutvecklare, transformation lead, organizational development, service/process designer]
  - lane_id: L2
    name: "Strategy / governance / public systems"
    bucket: core
    priority: 1
    queries: [strateg, utredare, policyanalytiker, strategisk rådgivare, governance, public sector innovation, institutional development, samhällsutvecklare]
  - lane_id: L3
    name: "Evaluation / MEAL / learning / analysis"
    bucket: core
    priority: 1
    queries: [utvärderare, MEAL, MEL, M&E, analytiker, impact, learning, evaluation advisor, monitoring evaluation]
  - lane_id: L4
    name: "Programme / project / innovation leadership"
    bucket: core
    priority: 1
    queries: [programledare, program manager, senior projektledare, innovationsledare, utvecklingsledare, change lead, transformation manager]
  - lane_id: L5
    name: "Rights / participation / social sustainability"
    bucket: core
    priority: 1
    queries: [barnrätt, delaktighet, social hållbarhet, demokratiutveckling, participation, community development, youth engagement]
  - lane_id: L6
    name: "Consulting / advisory"
    bucket: core
    priority: 1
    queries: [management consultant, senior consultant, strategic advisor, organisationskonsult, verksamhetskonsult, transformation consultant]
  - lane_id: L7
    name: "Culture / creative ecosystem"
    bucket: adjacent
    priority: 2
    queries: [kulturstrateg, kulturutvecklare, creative industries, program producer, cultural development, music industry, festival development]
  - lane_id: L8
    name: "Board / advisory governance"
    bucket: bridge
    priority: 3
    queries: [board member, advisory board, nonprofit governance]
  - lane_id: L9
    name: "AI / data-informed organisational transformation"
    bucket: adjacent
    priority: 2
    queries: [verksamhetsutvecklare digitalisering, digital transformation, AI transformation, datadriven verksamhetsutveckling, digitaliseringsstrateg, business transformation]

negative_filters:
  - roles that are primarily pure sales without development/strategy responsibility
  - roles requiring credentials or licenses not evidenced in profile

triage_rule: "Triage may rank; only a full HRDM-R run may produce candidate positioning."

user_search_overlay:
  source: user_input
  scope: search_only
  specific_wishes_or_needs: ""
