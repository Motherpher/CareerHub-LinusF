version: '1.0'
objective: Measure what the market actually responds to rather than collapsing the
  profile into one assumed occupational identity.
unit_of_analysis: opportunity x profile_surface x outreach/application event
surfaces:
- systems-process
- strategy-governance
- evaluation-learning
- civic-rights
- consulting-advisory
- culture-creative
- ai-data-transformation
funnel:
- exposed
- interested
- contacted
- qualified_contact
- interview_1
- interview_deep
- case_or_test
- references
- offer
- assignment
- denied
- withdrawn
- no_response
rules:
- Never change factual evidence between surfaces.
- Track the surface used for every application/outreach.
- Separate passive inbound from active applications.
- No-response is a valid outcome after a defined observation window; do not invent
  a rejection.
- Do not infer market preference from very small samples; report counts and conversion
  rates with sample size.
